<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Discat Dashboard</title>
  <desc id="desc">Discord Botの管理画面をイメージした抽象的なダッシュボード</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090a0f"/>
      <stop offset="1" stop-color="#151120"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1b1d27"/>
      <stop offset="1" stop-color="#111219"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c4b5ff"/>
      <stop offset="1" stop-color="#7455d9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#9b7bff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#9b7bff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="34" stdDeviation="40" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1220" cy="210" r="430" fill="url(#glow)"/>
  <circle cx="248" cy="905" r="360" fill="url(#glow)" opacity=".4"/>

  <g filter="url(#shadow)">
    <rect x="128" y="98" width="1344" height="804" rx="34" fill="#0d0e13" stroke="#f2efe8" stroke-opacity=".2"/>
    <rect x="158" y="128" width="1284" height="744" rx="20" fill="url(#panel)" stroke="#f2efe8" stroke-opacity=".08"/>
  </g>

  <g>
    <rect x="158" y="128" width="238" height="744" rx="20" fill="#0d0e14"/>
    <path d="M396 128v744" stroke="#f2efe8" stroke-opacity=".1"/>
    <rect x="190" y="170" width="48" height="48" rx="14" fill="url(#accent)"/>
    <path d="M204 190c0-9 20-9 20 0v8c0 9-20 9-20 0z" fill="#0b0b10"/>
    <circle cx="210" cy="194" r="2" fill="#c4b5ff"/>
    <circle cx="218" cy="194" r="2" fill="#c4b5ff"/>
    <text x="254" y="192" fill="#f2efe8" font-family="Arial, sans-serif" font-size="23" font-weight="700">Discat</text>
    <text x="254" y="211" fill="#8e8e98" font-family="monospace" font-size="10" letter-spacing="2">DASHBOARD</text>

    <g fill="#8e8e98" font-family="Arial, sans-serif" font-size="14">
      <rect x="184" y="270" width="186" height="52" rx="12" fill="#9b7bff" fill-opacity=".14" stroke="#9b7bff" stroke-opacity=".35"/>
      <circle cx="210" cy="296" r="7" fill="#c4b5ff"/><text x="232" y="301" fill="#f2efe8">Overview</text>
      <circle cx="210" cy="361" r="7" fill="none" stroke="#777785"/><text x="232" y="366">Servers</text>
      <circle cx="210" cy="426" r="7" fill="none" stroke="#777785"/><text x="232" y="431">Moderation</text>
      <circle cx="210" cy="491" r="7" fill="none" stroke="#777785"/><text x="232" y="496">Voice / TTS</text>
      <circle cx="210" cy="556" r="7" fill="none" stroke="#777785"/><text x="232" y="561">Security</text>
      <circle cx="210" cy="621" r="7" fill="none" stroke="#777785"/><text x="232" y="626">Activity</text>
    </g>
    <rect x="184" y="780" width="186" height="60" rx="14" fill="#171820" stroke="#f2efe8" stroke-opacity=".1"/>
    <circle cx="214" cy="810" r="15" fill="#7156ca"/>
    <text x="242" y="806" fill="#f2efe8" font-family="Arial, sans-serif" font-size="12">XERO Server</text>
    <text x="242" y="823" fill="#8e8e98" font-family="monospace" font-size="9">CONNECTED</text>
  </g>

  <g>
    <text x="442" y="187" fill="#f2efe8" font-family="Arial, sans-serif" font-size="27" font-weight="700">Good evening, XERO</text>
    <text x="442" y="216" fill="#8e8e98" font-family="Arial, sans-serif" font-size="13">Your community systems are operating normally.</text>
    <rect x="1262" y="169" width="136" height="42" rx="21" fill="#171820" stroke="#f2efe8" stroke-opacity=".12"/>
    <circle cx="1286" cy="190" r="5" fill="#a7e7bd"/>
    <text x="1301" y="195" fill="#c9c6c0" font-family="monospace" font-size="10">ALL ONLINE</text>
  </g>

  <g>
    <rect x="442" y="266" width="292" height="170" rx="19" fill="#15161e" stroke="#f2efe8" stroke-opacity=".1"/>
    <text x="470" y="300" fill="#8e8e98" font-family="monospace" font-size="10" letter-spacing="1.4">TOTAL SERVERS</text>
    <text x="470" y="365" fill="#f2efe8" font-family="Arial, sans-serif" font-size="55" font-weight="700">128</text>
    <path d="M470 406c31-26 50-7 77-30 26-23 46 17 73-8 28-25 48 0 83-39" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>

    <rect x="756" y="266" width="292" height="170" rx="19" fill="#15161e" stroke="#f2efe8" stroke-opacity=".1"/>
    <text x="784" y="300" fill="#8e8e98" font-family="monospace" font-size="10" letter-spacing="1.4">ACTIVE USERS</text>
    <text x="784" y="365" fill="#f2efe8" font-family="Arial, sans-serif" font-size="55" font-weight="700">8.4K</text>
    <g fill="#9b7bff">
      <rect x="786" y="398" width="18" height="13" rx="3" opacity=".35"/><rect x="812" y="384" width="18" height="27" rx="3" opacity=".45"/>
      <rect x="838" y="371" width="18" height="40" rx="3" opacity=".56"/><rect x="864" y="390" width="18" height="21" rx="3" opacity=".4"/>
      <rect x="890" y="357" width="18" height="54" rx="3" opacity=".7"/><rect x="916" y="343" width="18" height="68" rx="3" opacity=".9"/>
      <rect x="942" y="366" width="18" height="45" rx="3" opacity=".6"/><rect x="968" y="333" width="18" height="78" rx="3"/>
    </g>

    <rect x="1070" y="266" width="328" height="170" rx="19" fill="#15161e" stroke="#f2efe8" stroke-opacity=".1"/>
    <text x="1098" y="300" fill="#8e8e98" font-family="monospace" font-size="10" letter-spacing="1.4">SECURITY STATUS</text>
    <circle cx="1152" cy="363" r="43" fill="none" stroke="#252632" stroke-width="12"/>
    <circle cx="1152" cy="363" r="43" fill="none" stroke="#a7e7bd" stroke-width="12" stroke-linecap="round" stroke-dasharray="250 270" transform="rotate(-90 1152 363)"/>
    <path d="m1136 363 11 11 23-27" fill="none" stroke="#a7e7bd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1220" y="356" fill="#f2efe8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Protected</text>
    <text x="1220" y="382" fill="#8e8e98" font-family="Arial, sans-serif" font-size="12">Guard is watching</text>
  </g>

  <g>
    <rect x="442" y="462" width="606" height="356" rx="20" fill="#15161e" stroke="#f2efe8" stroke-opacity=".1"/>
    <text x="472" y="500" fill="#f2efe8" font-family="Arial, sans-serif" font-size="17" font-weight="700">Community activity</text>
    <text x="472" y="522" fill="#8e8e98" font-family="monospace" font-size="9">LAST 7 DAYS</text>
    <g stroke="#fff" stroke-opacity=".055">
      <path d="M472 574h544M472 630h544M472 686h544M472 742h544"/>
    </g>
    <path d="M484 727c62-38 82-25 132-85 50-60 84 16 132-30 49-46 75-30 112-72 37-42 82 23 144-37" fill="none" stroke="#9b7bff" stroke-width="6" stroke-linecap="round"/>
    <path d="M484 727c62-38 82-25 132-85 50-60 84 16 132-30 49-46 75-30 112-72 37-42 82 23 144-37V782H484z" fill="url(#accent)" opacity=".08"/>
    <g fill="#c4b5ff">
      <circle cx="616" cy="642" r="6"/><circle cx="748" cy="612" r="6"/><circle cx="860" cy="540" r="6"/><circle cx="1004" cy="503" r="6"/>
    </g>

    <rect x="1070" y="462" width="328" height="356" rx="20" fill="#15161e" stroke="#f2efe8" stroke-opacity=".1"/>
    <text x="1100" y="500" fill="#f2efe8" font-family="Arial, sans-serif" font-size="17" font-weight="700">Recent events</text>
    <g font-family="Arial, sans-serif">
      <circle cx="1114" cy="558" r="14" fill="#9b7bff" fill-opacity=".25"/><circle cx="1114" cy="558" r="5" fill="#c4b5ff"/>
      <text x="1142" y="554" fill="#c9c6c0" font-size="12">Member verified</text><text x="1142" y="573" fill="#777785" font-size="10">Discat Guard · now</text>
      <path d="M1114 582v42" stroke="#f2efe8" stroke-opacity=".08"/>
      <circle cx="1114" cy="638" r="14" fill="#a7e7bd" fill-opacity=".16"/><circle cx="1114" cy="638" r="5" fill="#a7e7bd"/>
      <text x="1142" y="634" fill="#c9c6c0" font-size="12">Ticket resolved</text><text x="1142" y="653" fill="#777785" font-size="10">Support · 2 min</text>
      <path d="M1114 662v42" stroke="#f2efe8" stroke-opacity=".08"/>
      <circle cx="1114" cy="718" r="14" fill="#9b7bff" fill-opacity=".25"/><circle cx="1114" cy="718" r="5" fill="#c4b5ff"/>
      <text x="1142" y="714" fill="#c9c6c0" font-size="12">Voice session started</text><text x="1142" y="733" fill="#777785" font-size="10">TTS · 8 min</text>
    </g>
  </g>

  <path d="M1442 773v73a26 26 0 0 1-26 26h-73" fill="none" stroke="#c4b5ff" stroke-opacity=".5"/>
  <circle cx="1442" cy="773" r="4" fill="#c4b5ff"/>
</svg>
